# =============================================================================
# Training Pipeline — Daily Scheduled Workflow
# =============================================================================
# Pulls features from MongoDB, trains multiple models (XGBoost, RF, Ridge),
# evaluates performance, and saves refreshed local model artifacts.
#
# Schedule: Daily at 02:00 UTC
# Manual: Can also be triggered via workflow_dispatch
# =============================================================================

name: Training Pipeline (Daily)

on:
  schedule:
    # Run daily at 2:00 AM UTC (gives time for hourly features to accumulate)
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

env:
  PYTHON_VERSION: "3.11"

jobs:
  training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Run training pipeline
      # --------------------------------------------------
      - name: Run Training Pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE || vars.MONGODB_DATABASE }}
          MONGODB_FEATURE_COLLECTION: ${{ secrets.MONGODB_FEATURE_COLLECTION || vars.MONGODB_FEATURE_COLLECTION }}
        run: |
          python training_pipeline.py

      # --------------------------------------------------
      # 5. Report status
      # --------------------------------------------------
      - name: Pipeline status
        if: always()
        run: |
          echo "Training pipeline completed with status: ${{ job.status }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
