# =============================================================================
# Feature Pipeline — Hourly Scheduled Workflow
# =============================================================================
# Fetches latest air quality + weather data from Open-Meteo for Karachi,
# computes ML features, and upserts them into MongoDB.
#
# Schedule: Every hour at minute 0
# Manual: Can also be triggered via workflow_dispatch
# =============================================================================

name: Feature Pipeline (Hourly)

on:
  schedule:
    # Run every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:
    # Allow manual triggering from the Actions tab
    inputs:
      backfill:
        description: "Run backfill instead of incremental"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  PYTHON_VERSION: "3.11"

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Run feature pipeline
      # --------------------------------------------------
      - name: Run Feature Pipeline
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE || vars.MONGODB_DATABASE }}
          MONGODB_FEATURE_COLLECTION: ${{ secrets.MONGODB_FEATURE_COLLECTION || vars.MONGODB_FEATURE_COLLECTION }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            echo "Running backfill mode..."
            python feature_pipeline.py --backfill
          else
            echo "Running hourly incremental mode..."
            python feature_pipeline.py
          fi

      # --------------------------------------------------
      # 5. Report status
      # --------------------------------------------------
      - name: Pipeline status
        if: always()
        run: |
          echo "Feature pipeline completed with status: ${{ job.status }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
